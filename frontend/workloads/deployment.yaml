apiVersion: apps/v1
kind: Deployment
metadata:
  name: scloud-frontend
  namespace: scloud-frontend
  labels:
    app: scloud-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scloud-frontend
  template:
    metadata:
      labels:
        app: scloud-frontend
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001

      containers:
      - name: frontend
        image: 2scloud/frontend:latest
        imagePullPolicy: Never

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        envFrom:
        - configMapRef:
            name: frontend-config

        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false   # Next.js standalone writes to .next/cache
          capabilities:
            drop:
            - ALL
