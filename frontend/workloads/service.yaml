# ClusterIP — le frontend est exposé via le gateway uniquement,
# pas directement accessible depuis l'extérieur.
apiVersion: v1
kind: Service
metadata:
  name: scloud-frontend
  namespace: scloud-frontend
  labels:
    app: scloud-frontend
spec:
  type: ClusterIP
  selector:
    app: scloud-frontend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
