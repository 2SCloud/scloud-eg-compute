---
# Alloy — discovers pods/services for scraping; needs cluster-wide read access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: scloud-observability
  labels:
    app: alloy
automountServiceAccountToken: true
---
# Prometheus — scrape target discovery
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: scloud-observability
  labels:
    app: prometheus
automountServiceAccountToken: true
---
# Grafana, Loki, Tempo — no k8s API access needed
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: scloud-observability
  labels:
    app: grafana
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: scloud-observability
  labels:
    app: loki
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo
  namespace: scloud-observability
  labels:
    app: tempo
automountServiceAccountToken: false
