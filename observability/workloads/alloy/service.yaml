# Service name must be "alloy" — scloud-dns exports OTEL to
# alloy.scloud-observability.svc:4318
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: scloud-observability
  labels:
    app: alloy
spec:
  selector:
    app: alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: 12345
      targetPort: metrics
      protocol: TCP
