apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: scloud-observability
  labels:
    app: mimir
spec:
  type: ClusterIP
  selector:
    app: mimir
  ports:
  - name: http
    protocol: TCP
    port: 9009
    targetPort: http
  - name: grpc
    protocol: TCP
    port: 9095
    targetPort: grpc
