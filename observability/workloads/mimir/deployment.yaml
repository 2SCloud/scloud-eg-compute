apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: scloud-observability
  labels:
    app: mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data
        - name: tmp
          emptyDir: {}

      containers:
      - name: mimir
        image: grafana/mimir:latest
        args:
          - -config.file=/etc/mimir/config.yaml
          - -target=all

        ports:
          - name: http
            containerPort: 9009
            protocol: TCP
          - name: grpc
            containerPort: 9095
            protocol: TCP

        workingDir: /data

        volumeMounts:
          - name: config
            mountPath: /etc/mimir
            readOnly: true
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3

        livenessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 3

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
