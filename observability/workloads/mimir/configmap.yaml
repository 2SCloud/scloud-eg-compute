apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: scloud-observability
  labels:
    app: mimir
data:
  config.yaml: |
    multitenancy_enabled: false

    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb
      bucket_store:
        sync_dir: /data/tsdb-sync

    compactor:
      data_dir: /data/compactor

    ingester:
      ring:
        replication_factor: 1

    store_gateway:
      sharding_ring:
        replication_factor: 1

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/rules

    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
      log_level: warn
