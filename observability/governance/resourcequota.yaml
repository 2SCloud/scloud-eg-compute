apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: scloud-observability
spec:
  hard:
    # Compute — 5 components, each up to ~2 CPU / 4Gi
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "10"
    limits.memory: "20Gi"

    # Storage — Prometheus + Loki + Tempo + Grafana PVCs
    requests.storage: "100Gi"
    persistentvolumeclaims: "10"

    # Object caps
    pods: "30"
    services: "30"
    configmaps: "50"
    secrets: "30"
