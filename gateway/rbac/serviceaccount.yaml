# ------------------------------------------------------------
# edge-gateway ServiceAccount
# The gateway process requires NO access to the Kubernetes API.
# automountServiceAccountToken: false removes the projected
# /var/run/secrets/kubernetes.io/serviceaccount volume entirely,
# reducing the attack surface inside the pod.
# ------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-gateway
  namespace: scloud-gateway
  labels:
    app: edge-gateway
    app.kubernetes.io/component: ingress
automountServiceAccountToken: false
