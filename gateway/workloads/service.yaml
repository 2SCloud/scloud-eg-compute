# ------------------------------------------------------------
# Edge Gateway LoadBalancer Service — the single external entrypoint
#
# externalTrafficPolicy: Local preserves the real client source IP
# so the WAF's ip_allowlist/denylist sees the actual caller IP,
# not a SNAT'd node IP.
#
# For bare-metal clusters without a cloud LB controller, either:
#   1. Install MetalLB and optionally set the annotation below
#   2. Change type to NodePort and expose via <NodeIP>:30080
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  namespace: scloud-gateway
  labels:
    app: edge-gateway
    app.kubernetes.io/component: ingress
  annotations:
    # Uncomment for MetalLB — specify which address pool to use:
    # metallb.universe.tf/address-pool: public
spec:
  type: LoadBalancer
  selector:
    app: edge-gateway
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http   # resolves to containerPort named "http" (8080)
    # nodePort: 30080  # set this if using type: NodePort instead
  externalTrafficPolicy: Local
