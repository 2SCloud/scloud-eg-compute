apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: scloud-gateway
  labels:
    app: edge-gateway
    app.kubernetes.io/component: ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: edge-gateway
        app.kubernetes.io/component: ingress
    spec:
      serviceAccountName: edge-gateway
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      volumes:
        # Main config (config.toml) mounted at /etc/edge-gateway/
        - name: gateway-config
          configMap:
            name: edge-gateway-config
            items:
              - key: config.toml
                path: config.toml

        # WAF rules file — must be at /app/internal/config/rules/waf.json
        # because runtime.go calls os.DirFS("./internal/config/rules/")
        # with workingDir=/app
        - name: waf-rules
          configMap:
            name: edge-gateway-config
            items:
              - key: waf.json
                path: waf.json

        # Public TLS cert (issued by cert-manager — see
        # gateway/config/tls-certificate.yaml). Renewed in place by
        # cert-manager; the kubelet rewrites the mounted files and the
        # gateway picks them up on the next TLS handshake.
        - name: tls
          secret:
            secretName: edge-gateway-tls
            defaultMode: 0400

        # Writable WASM compilation cache (wazero JIT cache)
        - name: wasm-cache
          emptyDir: {}

        # Writable /tmp for Go runtime and wazero temp files
        - name: tmp
          emptyDir: {}

      containers:
      - name: edge-gateway
        image: 2scloud/edge-gateway:latest
        imagePullPolicy: IfNotPresent

        workingDir: /app

        env:
          - name: EDGE_CONFIG
            value: /etc/edge-gateway/config.toml

        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
          - name: https
            containerPort: 8443
            protocol: TCP
          - name: admin
            containerPort: 9090
            protocol: TCP

        volumeMounts:
          - name: gateway-config
            mountPath: /etc/edge-gateway
            readOnly: true
          - name: waf-rules
            mountPath: /app/internal/config/rules
            readOnly: true
          - name: tls
            mountPath: /etc/edge-gateway-tls
            readOnly: true
          - name: wasm-cache
            mountPath: /tmp/wasm-cache
          - name: tmp
            mountPath: /tmp

        # /healthz is bypassed by the WAF middleware — safe to probe directly
        startupProbe:
          # wazero compiles WASM to native on first load — allow up to 60s
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 12
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 2

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
