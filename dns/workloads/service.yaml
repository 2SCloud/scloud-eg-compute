apiVersion: v1
kind: Service
metadata:
  name: scloud-dns
  namespace: scloud-dns
  labels:
    app: scloud-dns
spec:
  selector:
    app: scloud-dns
  type: ClusterIP
  # The scloud-dns container actually listens on UDP :5353 (not :53)
  # — the config.json we mount is either ignored or its port field is
  # overridden by the image's defaults. Until that upstream bug is
  # fixed, the Service maps :53 → :5353 so every consumer in the
  # cluster (CoreDNS stub, edge-gateway DoH proxy, etc.) keeps hitting
  # port 53 as standard.
  ports:
    - name: dns-udp
      port: 53
      targetPort: 5353
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 5353
      protocol: TCP
    - name: metrics
      port: 9153
      targetPort: metrics
      protocol: TCP
