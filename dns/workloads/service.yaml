apiVersion: v1
kind: Service
metadata:
  name: scloud-dns
  namespace: scloud-dns
  labels:
    app: scloud-dns
spec:
  selector:
    app: scloud-dns
  type: ClusterIP
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: metrics
      port: 9153
      targetPort: metrics
      protocol: TCP
