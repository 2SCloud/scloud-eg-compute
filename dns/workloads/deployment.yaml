apiVersion: apps/v1
kind: Deployment
metadata:
  name: scloud-dns
  namespace: scloud-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scloud-dns
  template:
    metadata:
      labels:
        app: scloud-dns
    spec:
      serviceAccountName: scloud-dns
      automountServiceAccountToken: true

      volumes:
        - name: config
          configMap:
            name: scloud-dns-config
        - name: logs
          emptyDir: {}

      containers:
        - name: scloud-dns
          image: ghcr.io/2scloud/scloud-dns:0.3.0-doh-stdout
          imagePullPolicy: Always

          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-doh
              # RFC 8484 DoH endpoint. Plain HTTP — TLS is terminated at
              # the edge-gateway; scloud-dns sits behind it on the pod network.
              containerPort: 8053
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP

          volumeMounts:
            - name: config
              # Overrides the image's baked-in /app/config/ entirely
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /var/log/scloud-dns


          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

          resources:
            requests:
              memory: "256Mi"
              ephemeral-storage: "500Mi"
            limits:
              memory: "512Mi"
              ephemeral-storage: "1Gi"

          env:
            - name: OTEL_SERVICE_NAME
              value: "scloud-dns"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.scloud-observability.svc:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_LOGS_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=scloud-dns,service.version=0.3.0"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
